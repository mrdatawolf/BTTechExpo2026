<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Show Showcase — bizTech</title>
<link rel="icon" href="assets/logo/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="stage">
  <div class="track" id="track" aria-live="polite"></div>

  <div class="testimonial" id="testimonial" aria-live="polite">
    <div class="testimonial-inner">
      <p class="testimonial-quote" id="testimonialQuote"></p>
      <p class="testimonial-author" id="testimonialAuthor"></p>
    </div>
  </div>

  <footer>
    <div class="logo-chip" id="logoChip"></div>
    <div class="event-info" id="eventInfo"></div>
    <div class="footer-spacer"></div>
    <div class="footer-controls">
      <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous slide">‹</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn" type="button" aria-label="Next slide">›</button>
    </div>
  </footer>
</div>

<script src="js/theater.js"></script>
<script src="js/transitions.js"></script>
<script src="js/testimonials.js"></script>
<script src="js/script.js"></script>
</body>
</html>
